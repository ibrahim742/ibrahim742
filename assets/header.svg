<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ibrahim - Full-Stack Web Developer, IT and Network Operations" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.55" stop-color="#0B1730"/>
      <stop offset="1" stop-color="#0C4A6E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#38BDF8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="clip">
      <rect width="1200" height="280" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="280" fill="url(#bg)"/>
    <rect width="1200" height="280" fill="url(#grid)"/>
    <ellipse cx="980" cy="140" rx="330" ry="220" fill="url(#glow)"/>

    <!-- scanning light -->
    <rect x="-240" y="0" width="240" height="280" fill="url(#scan)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="1500 0" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- network topology -->
    <g stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.5">
      <line x1="800" y1="70" x2="900" y2="150"/>
      <line x1="900" y1="150" x2="1010" y2="80"/>
      <line x1="1010" y1="80" x2="1100" y2="170"/>
      <line x1="900" y1="150" x2="960" y2="225"/>
      <line x1="960" y1="225" x2="1100" y2="170"/>
      <line x1="850" y1="235" x2="960" y2="225"/>
      <line x1="1010" y1="80" x2="1135" y2="55"/>
      <line x1="1135" y1="55" x2="1100" y2="170"/>
      <line x1="800" y1="70" x2="850" y2="235"/>
    </g>

    <!-- pulse rings -->
    <g fill="none" stroke="#38BDF8" stroke-width="1.5">
      <circle cx="900" cy="150" r="8">
        <animate attributeName="r" from="8" to="30" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" from="0.7" to="0" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1010" cy="80" r="5">
        <animate attributeName="r" from="5" to="22" dur="2.8s" begin="0.9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" from="0.7" to="0" dur="2.8s" begin="0.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1100" cy="170" r="5">
        <animate attributeName="r" from="5" to="22" dur="2.8s" begin="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" from="0.7" to="0" dur="2.8s" begin="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- nodes -->
    <g fill="#38BDF8">
      <circle cx="800" cy="70" r="5"/>
      <circle cx="1010" cy="80" r="5"/>
      <circle cx="1100" cy="170" r="5"/>
      <circle cx="960" cy="225" r="5"/>
      <circle cx="850" cy="235" r="4"/>
      <circle cx="1135" cy="55" r="4"/>
    </g>
    <circle cx="900" cy="150" r="9" fill="url(#accent)"/>

    <!-- data packets -->
    <circle r="3.5" fill="#E2E8F0">
      <animateMotion dur="3.2s" repeatCount="indefinite" path="M800 70 L900 150 L1010 80 L1100 170"/>
    </circle>
    <circle r="3.5" fill="#818CF8">
      <animateMotion dur="4s" begin="1s" repeatCount="indefinite" path="M850 235 L960 225 L1100 170 L1135 55"/>
    </circle>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="279" rx="17.5" stroke="#38BDF8" stroke-opacity="0.25"/>

  <!-- terminal prompt -->
  <text x="60" y="76" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="16" fill="#38BDF8">~/ibrahim742 $ whoami</text>
  <rect x="262" y="63" width="9" height="17" fill="#38BDF8">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- name -->
  <text x="58" y="148" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="68" font-weight="800" fill="#FFFFFF" letter-spacing="1">Ibrahim</text>
  <rect x="60" y="162" width="130" height="4" rx="2" fill="url(#accent)"/>

  <!-- role -->
  <text x="60" y="200" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="22" fill="#E2E8F0">Full-Stack Web Developer  •  IT &amp; Network Operations</text>

  <!-- tags -->
  <g font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="13" fill="#BAE6FD" text-anchor="middle">
    <rect x="60" y="218" width="47" height="28" rx="14" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.45"/>
    <text x="83.5" y="236.5">PHP</text>
    <rect x="117" y="218" width="79" height="28" rx="14" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.45"/>
    <text x="156.5" y="236.5">Laravel</text>
    <rect x="206" y="218" width="71" height="28" rx="14" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.45"/>
    <text x="241.5" y="236.5">NestJS</text>
    <rect x="287" y="218" width="102" height="28" rx="14" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.45"/>
    <text x="338" y="236.5">TypeScript</text>
    <rect x="399" y="218" width="71" height="28" rx="14" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.45"/>
    <text x="434.5" y="236.5">Python</text>
    <rect x="480" y="218" width="63" height="28" rx="14" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.45"/>
    <text x="511.5" y="236.5">Nginx</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
