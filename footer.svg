<svg width="1200" height="150" viewBox="0 0 1200 150" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Build reliable tools, keep it simple, ship consistently." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0C4A6E"/>
      <stop offset="0.5" stop-color="#0B1730"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#38BDF8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="clip">
      <rect width="1200" height="150" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="150" fill="url(#bg)"/>
    <rect width="1200" height="150" fill="url(#grid)"/>

    <!-- static faint line -->
    <path d="M0 112 H430 L448 112 L460 88 L474 130 L488 78 L502 118 L514 112 H1200" stroke="#38BDF8" stroke-opacity="0.18" stroke-width="2" fill="none"/>
    <!-- animated heartbeat -->
    <path pathLength="1000" d="M0 112 H430 L448 112 L460 88 L474 130 L488 78 L502 118 L514 112 H1200" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" fill="none" stroke-dasharray="140 860">
      <animate attributeName="stroke-dashoffset" from="140" to="-1000" dur="3.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="149" rx="17.5" stroke="#38BDF8" stroke-opacity="0.25"/>

  <text x="600" y="58" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="20" fill="#E2E8F0">Build reliable tools. Keep it simple. Ship consistently.</text>
  <text x="600" y="84" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="13" fill="#38BDF8" fill-opacity="0.85">// terima kasih sudah mampir</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
